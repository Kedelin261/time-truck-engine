<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trucking.Time — Smarter Loads</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Inline critical CSS — prevents blank flash before React loads */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        min-height: 100vh;
      }
      /* App shell skeleton — visible immediately */
      .app-shell-init {
        display: flex;
        min-height: 100vh;
      }
      .sidebar-init {
        width: 240px;
        min-height: 100vh;
        background: #0f2744;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .main-init {
        margin-left: 0;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        color: #64748b;
        font-size: 14px;
      }
      .spinner {
        width: 40px; height: 40px;
        border: 4px solid #e2e8f0;
        border-top-color: #1a3c5e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* Hide skeleton once React mounts */
      #root:not(:empty) + #loading-skeleton { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Loading skeleton shown until React JS bundle executes -->
    <div id="loading-skeleton" class="app-shell-init">
      <div class="sidebar-init">
        <span style="color:#f59e0b;font-size:28px;">🚛</span>
      </div>
      <div class="main-init">
        <div class="spinner"></div>
        <div>Loading Trucking.Time...</div>
      </div>
    </div>

    <script>
      // Hide skeleton as soon as React renders anything into #root
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root')
        const skel = document.getElementById('loading-skeleton')
        if (root && root.children.length > 0 && skel) {
          skel.style.display = 'none'
          observer.disconnect()
        }
      })
      observer.observe(document.getElementById('root'), { childList: true })
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
