spring.application.name=time-truck-engine

# ── Crypto ──────────────────────────────────────────────────────────────────
app.crypto.key=9f2c1b7a2e6d4c8f9a1b3c5d7e9f0a1b9f2c1b7a2e6d4c8f

# ── Database (Postgres in prod / H2 in dev) ──────────────────────────────────
# Default: H2 in-memory for local dev
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:truckengine;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# ── Scheduling ───────────────────────────────────────────────────────────────
spring.task.scheduling.enabled=true

# ── SMS (Twilio) ─────────────────────────────────────────────────────────────
# Set via environment variables — leave blank for dev console mode
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.from.number=${TWILIO_FROM_NUMBER:+15550000000}

# ── Email (SendGrid) ─────────────────────────────────────────────────────────
# Set via environment variables — leave blank for dev console mode
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:noreply@trucking.time}
sendgrid.from.name=${SENDGRID_FROM_NAME:Trucking.Time}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.time.truckengine=INFO
logging.level.org.springframework.scheduling=INFO

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
